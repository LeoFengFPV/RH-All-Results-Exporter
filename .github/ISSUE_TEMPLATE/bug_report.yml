name: 缺陷反馈
description: 反馈「全成绩导出」插件的问题
title: "[缺陷]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请填写下列信息，并删除日志中的隐私内容。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 描述实际现象，以及你期望的结果。
      placeholder: |
        1. 当时的情况是……
        2. 导出结果是……
        3. 我期望是……
    validations:
      required: true

  - type: input
    id: rh-version
    attributes:
      label: RotorHazard 版本
      placeholder: 例如 4.4.0
    validations:
      required: true

  - type: input
    id: rhapi-version
    attributes:
      label: RHAPI 版本
      placeholder: 例如 1.4
    validations:
      required: true

  - type: input
    id: openpyxl-version
    attributes:
      label: openpyxl 版本
      placeholder: 例如 3.1.5
    validations:
      required: false

  - type: input
    id: hardware
    attributes:
      label: 硬件 / 操作系统
      placeholder: 例如 Raspberry Pi 4 Model B，Raspberry Pi OS
    validations:
      required: false

  - type: dropdown
    id: start-behavior
    attributes:
      label: 起跑方式
      options:
        - Hole Shot
        - First Lap
        - Staggered Start
        - 不确定 / 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴报错日志。请删除姓名、IP、Token 等隐私信息。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已从本反馈中删除隐私数据（飞手姓名、IP 地址、Token 等）
          required: true
